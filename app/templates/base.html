<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Flask Application{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
    <h1>Flask Application</h1>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('users.greetings', name='John', age=30) }}">Greet John</a></li>
            <li><a href="{{ url_for('users.admin') }}">Admin</a></li>
            <li><a href="{{ url_for('products.index') }}">Products</a></li>
        </ul>
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>&copy; {{ 2025 }}</p>
</footer>
</body>
</html>
